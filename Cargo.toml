[package]
name = "alkahest"
version = "0.6.0"
edition = "2024"
default-run = "alkahest"

[[bin]]
name = "alkahest"
path = "src/main.rs"

[workspace]
members = [
    "crates/data",
    "crates/core",
    "crates/render",
    "crates/egui-d3d11",
    "crates/egui-sdl3-platform",
    "crates/rrise",
]

[workspace.dependencies]
anyhow = "1"
ahash = "0.8"
bytemuck = { version = "1", features = ["derive"] }
crossbeam = "0.8"
d3d11 = { version = "0.3.3", features = ["sdl3"] }
egui = { version = "0.35", default-features = false, features = ["bytemuck"] }
egui_dock = "0.20"
glam = { version = "0.29", features = ["bytemuck", "fast-math"] }
itertools = "0.15.0"
parking_lot = "0.12"
potassium = { git = "https://github.com/cohaereo/potassium.git" }
profiling = "1"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
sdl3 = { version = "0.16", features = ["raw-window-handle"] }
subsecond = "0.7.9"
tiger-parse = { version = "0.8.0", git = "https://github.com/v4nguard/tiger-parse.git", features = [
    "check_types",
    "check_types_strict",
    "tiger_pkg",
    "check_types_debug",
] }
tiger-pkg = { version = "0.21.0", features = ["global_manager_instance"] }
tracing = "0.1"

[dependencies]
alkahest-core = { path = "./crates/core" }
alkahest-data = { path = "./crates/data" }
alkahest-render = { path = "./crates/render" }
egui-d3d11 = { path = "./crates/egui-d3d11" }
egui-sdl3-platform = { path = "./crates/egui-sdl3-platform" }
rrise = { path = "./crates/rrise", optional = true, features = [
    "AkOpusDecoder",
] }

# (De)serialization
serde_json = "1"
tiger-parse.workspace = true
tiger-pkg.workspace = true

# General
ahash.workspace = true
anyhow.workspace = true
bitflags = "2"
bytemuck = "1.22.0"
dhat = { version = "0.3.3", optional = true }
env_logger = "0.11.8"
itertools.workspace = true
parking_lot.workspace = true
profiling.workspace = true
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "std",
    "tracing-log",
] }
tracing.workspace = true
tracy-client = { version = "*", optional = true, default-features = false, features = [
    "broadcast",
    "callstack-inlines",
    "code-transfer",
    "context-switch-tracing",
    "crash-handler",
    "enable",
    #    "sampling",
    "system-tracing",
] }

# Graphics
d3d11.workspace = true
glam.workspace = true
sdl3.workspace = true

# UI
egui.workspace = true
egui_extras = { version = "0.35", features = ["image", "svg"] }
egui_dock.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4.5.37", features = ["derive"] }
google_material_symbols = "0.3"
hecs = "0.10.5"
rayon.workspace = true
chroma-dbg = "0.2.1"
subsecond.workspace = true
dioxus-devtools = "0.7.9"
serde.workspace = true
toml = "0.9.10"
fastrand = "2.4.1"
ehttp = { version = "0.7.1", features = ["json"] }
semver = "1.0.28"
build-time = "0.1.3"
directories = "6.0.0"
egui_ltreeview = "0.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[package.metadata.appimage]
assets = ["fxc-server.exe", "liboodle-data-shared.so"]
auto_link = true
auto_link_exclude_list = [
    "libc.so*",
    "libm.so*",
    "libgcc_s.so*",
    "libstdc++.so*",
    "ld-linux-x86-64.so*",
    "libdxvk_d3d11.so*",
    "libdxvk_dxgi.so*",
    "libSDL3.so*",
]

[build-dependencies]
embed-resource = "3.0.1"

[profile.dev.package.tiger-pkg]
opt-level = 3

[profile.dev.package.alkahest-data]
opt-level = 0

[profile.dev]
opt-level = 1
codegen-units = 256

[profile.profiling]
inherits = "release"
debug = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
# panic = "abort"
overflow-checks = false

[features]
tracy = ["profiling/profile-with-tracy", "dep:tracy-client"]
tracy-alloc = ["tracy"]
dhat-heap = ["dep:dhat"]
wwise = ["dep:rrise"]
