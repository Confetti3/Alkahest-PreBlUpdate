name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LIB: ${{ github.workspace }}\lib

jobs:
  format:
    name: Format
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - run: cargo fmt --all -- --check

  check:
    name: Check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: >-
          Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: >-
          cargo check --workspace --all-targets --locked
          --no-default-features

  clippy:
    name: Clippy
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: >-
          Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: >-
          cargo clippy --workspace --all-targets --locked
          --no-default-features

  test:
    name: Test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: >-
          Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: >-
          cargo test --workspace --all-targets --locked
          --no-default-features

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: >-
          actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294

  release-build:
    name: Release build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: >-
          Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: >-
          cargo build --profile dist --locked --no-default-features
          --bin alkahest-prebl
      - run: target\dist\alkahest-prebl.exe --version
      - name: Assemble test build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          New-Item -ItemType Directory target\package
          $files = @(
            "target\dist\alkahest-prebl.exe"
            "target\dist\SDL3.dll"
            "wordlist.txt"
            "LICENSE"
            "THIRD_PARTY_NOTICES.md"
          )
          Copy-Item $files target\package\
      - uses: >-
          actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main'
        with:
          name: alkahest-prebl-windows-x64-${{ github.sha }}
          path: target/package
          if-no-files-found: error
          retention-days: 14
