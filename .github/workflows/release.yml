name: Release candidate

on:
  push:
    tags: ["v0.7.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Verify, package, and attest
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a signed annotated tag
        shell: pwsh
        run: git verify-tag $env:GITHUB_REF_NAME
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-targets --locked --no-default-features
      - run: cargo build --profile dist --locked --no-default-features --bin alkahest-prebl
      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory target/package
          Copy-Item target/dist/alkahest-prebl.exe,target/dist/SDL3.dll,wordlist.txt,LICENSE target/package/
          target/package/alkahest-prebl.exe --version
          Compress-Archive target/package/* "target/alkahest-prebl-$env:GITHUB_REF_NAME-windows-x64.zip"
          Get-FileHash target/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content target/SHA256SUMS
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: target/package
          format: spdx-json
          output-file: target/alkahest-prebl.spdx.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            target/*.zip
            target/SHA256SUMS
            target/alkahest-prebl.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alkahest-prebl-${{ github.ref_name }}
          path: |
            target/*.zip
            target/SHA256SUMS
            target/alkahest-prebl.spdx.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/*.zip
            target/SHA256SUMS
            target/alkahest-prebl.spdx.json
